From da73b2d8e010a954f12b5d4a5dee6659cd5b53f2 Mon Sep 17 00:00:00 2001
From: claude <noreply@anthropic.com>
Date: Wed, 11 Nov 2026 22:44:43 +0000
Subject: [PATCH] Base Personal Launcher: minSdk 28, nombre y applicationId

---
 build.gradle | 14 +++++++-------
 1 file changed, 7 insertions(+), 7 deletions(-)

diff --git a/build.gradle b/build.gradle
index d0421b5..b41ec44 100644
--- a/build.gradle
+++ b/build.gradle
@@ -29,7 +29,7 @@ allprojects {
                 }
             }
             defaultConfig {
-                minSdk = 26
+                minSdk = 28
                 targetSdk = 37
                 vectorDrawables.useSupportLibrary = true
             }
@@ -227,7 +227,7 @@ android {
 
         debug {
             applicationIdSuffix ".debug"
-            resValue("string", "derived_app_name", "Lawnchair (Debug)")
+            resValue("string", "derived_app_name", "Personal Launcher (Debug)")
 
             manifestPlaceholders.quickstepMinSdk = "0"
             manifestPlaceholders.quickstepMaxSdk = "100000"
@@ -236,7 +236,7 @@ android {
         }
 
         release {
-            resValue("string", "derived_app_name", "Lawnchair")
+            resValue("string", "derived_app_name", "Personal Launcher")
             minifyEnabled true
             shrinkResources true
             pseudoLocalesEnabled false
@@ -263,21 +263,21 @@ android {
 
         withQuickstep {
             dimension "recents"
-            minSdk = 26
+            minSdk = 28
         }
 
         github {
-            applicationId 'app.lawnchair'
+            applicationId 'com.personal.launcher'
             dimension "channel"
         }
 
         nightly {
-            applicationId 'app.lawnchair.nightly'
+            applicationId 'com.personal.launcher.nightly'
             dimension "channel"
         }
 
         play {
-            applicationId "app.lawnchair.play"
+            applicationId "com.personal.launcher.play"
             dimension "channel"
             isDefault true
         }
-- 
2.43.0
